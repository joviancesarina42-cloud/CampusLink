name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build
        shell: powershell
        run: .\build.ps1
      - name: Package
        shell: powershell
        run: |
          Compress-Archive -Path dist\CampusLink -DestinationPath CampusLink-windows-x64.zip -Force
          $hash = (Get-FileHash -LiteralPath CampusLink-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  CampusLink-windows-x64.zip" | Set-Content -LiteralPath SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: CampusLink-windows-x64
          path: |
            CampusLink-windows-x64.zip
            SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            CampusLink-windows-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
